# Builds release binaries when a v* tag is pushed (see .github/workflows/release.yml).
# The version shown by `ompool version` comes from the git tag via Go's VCS stamping.
version: 2
project_name: ompool

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: [-s, -w]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
