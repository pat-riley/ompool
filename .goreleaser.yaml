# Builds release binaries when a v* tag is pushed (see .github/workflows/release.yml).
# The tag is stamped into `ompool version` and the title screen via -X main.buildVersion.
version: 2
project_name: ompool

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s", "-w", "-X main.buildVersion={{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
